[project]
name = "podcast-feed"
version = "0.1.0"
description = "Private podcast feeds from links to audio and video files, with an admin UI and an MCP server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Julius Printz" }]
keywords = ["podcast", "rss", "mcp", "feed", "audio"]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28",
    "httpcore>=1.0",
    "starlette",
    "jinja2>=3.1",
    "python-multipart",
    "uvicorn",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.3",
    "ruff>=0.14",
]

[project.scripts]
podcast-feed = "podcast_feed.main:main"

[project.urls]
Repository = "https://github.com/jprintz/podcast-feed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatchling ships every file under the package, so templates/ and static/ go into the wheel too.
[tool.hatch.build.targets.wheel]
packages = ["src/podcast_feed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# ruff format keeps lines short; it leaves long string literals alone.
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
