<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Podcast feeds{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; --line: #8886; --muted: #888; --bad: #c0392b; }
    body { font: 16px/1.5 system-ui, sans-serif; margin: 0 auto; max-width: 56rem; padding: 0 1rem 3rem; }
    header { padding: 1rem 0; border-bottom: 1px solid var(--line); }
    header a { font-weight: 600; text-decoration: none; }
    h1 { margin: 1.25rem 0 .25rem; overflow-wrap: anywhere; }
    h2 { margin: 2rem 0 .5rem; }
    h3 { margin: 1.5rem 0 .25rem; }
    section { margin-bottom: 2rem; }
    .muted { color: var(--muted); }
    .alert { border-left: 4px solid var(--bad); background: #c0392b22; padding: .5rem .75rem; margin: 1rem 0; }
    label { display: block; margin: .75rem 0 .25rem; }
    input[type=text], input[type=url], textarea { width: 100%; box-sizing: border-box; font: inherit; padding: .4rem; }
    button { font: inherit; padding: .35rem .8rem; cursor: pointer; }
    .danger { color: var(--bad); }
    .row { display: flex; gap: .5rem; }
    .row input { flex: 1; min-width: 0; }
    .scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    td.actions form, td.actions details { display: inline-block; margin: 0 .25rem .25rem 0; }
    details form { display: block; min-width: 14rem; }
    summary { cursor: pointer; }
  </style>
  <script src="/ui/static/htmx.min.js" defer></script>
  <script src="/ui/static/app.js" defer></script>
</head>
<body>
  <header><a href="/ui/">Podcast feeds</a></header>
  <main>
    {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
