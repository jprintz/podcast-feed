name: ci

# Tests on every push and pull request. Images go to GHCR from main
# (ghcr.io/jprintz/podcast-feed:main and :sha-<commit>) and from version tags
# (v0.1.0 -> :0.1.0, :0.1), linux/amd64 only (the VPS). The VPS pins version tags.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  # The same static binaries as in the Dockerfile.
  FFMPEG_IMAGE: docker.io/mwader/static-ffmpeg:9.0.2

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"
      - name: ffmpeg and ffprobe (the image's static binaries)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          id=$(docker create "$FFMPEG_IMAGE" /ffmpeg)
          docker cp "$id:/ffmpeg" "$RUNNER_TEMP/bin/ffmpeg"
          docker cp "$id:/ffprobe" "$RUNNER_TEMP/bin/ffprobe"
          docker rm "$id" >/dev/null
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: uv sync --all-extras --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      # With ffmpeg required: a missing one fails the tests instead of skipping them.
      - run: uv run pytest
        env:
          REQUIRE_FFMPEG: "1"

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: podcast-feed:test

      # Read-only, no capabilities, tmpfs volumes; the MCP tools and their annotations, the
      # admin UI, a feed round trip, and `time docker stop` under 8 s with exit status 0 (the
      # SIGTERM handling). `make smoke` runs the same script.
      - name: Smoke test
        run: scripts/smoke.sh podcast-feed:test

      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha

      - name: Build and push (amd64)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
